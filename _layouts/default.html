<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f6f7f5">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Product design guidelines home">
          <span class="brand-mark" aria-hidden="true">FS</span>
          <span>
            <strong>Product design guidelines</strong>
            <small>Filmmakers System</small>
          </span>
        </a>
        <span class="release-status"><span aria-hidden="true"></span> Early draft</span>
      </div>
    </header>

    <div class="mobile-navigation">
      <details>
        <summary>Browse guidelines</summary>
        {% include navigation.html %}
      </details>
    </div>

    <div class="site-shell">
      <aside class="sidebar" aria-label="Guideline navigation">
        {% include navigation.html %}
      </aside>

      <main id="main-content" class="main-content">
        {% if page.section %}
          <p class="section-label">{{ page.section }}</p>
        {% endif %}
        <article class="prose">
          {{ content }}
        </article>
      </main>
    </div>

    <footer class="site-footer">
      <div>
        <span>Filmmakers System product design guidelines</span>
        <a href="https://github.com/denkungsart/product-design-guidelines">View source on GitHub</a>
      </div>
    </footer>
  </body>
</html>
